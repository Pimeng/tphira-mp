name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 准备 Node.js 和依赖
      uses: ./.github/actions/setup-node-pnpm

    - name: 运行测试
      run: pnpm test

  memory-leak:
    needs: [test]
    runs-on: ubuntu-latest
    # 仅在基础测试通过后再跑，避免在已知失败的提交上重复消耗 CI 时间

    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 准备 Node.js 和依赖
      uses: ./.github/actions/setup-node-pnpm

    - name: 运行内存泄漏测试
      run: pnpm test:memory
      env:
        NODE_OPTIONS: --expose-gc