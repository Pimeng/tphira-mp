name: Release Benchmark

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build project
        run: pnpm run build

      - name: Run benchmark suite
        run: |
          # Prepare server config if missing
          if [ ! -f server_config.yml ]; then
            cp server_config.example.yml server_config.yml
          fi

          mkdir -p bench-results

          # Start mock auth server and capture its URL
          ./node_modules/.bin/tsx bench/start-mock-auth.ts > mock-auth.url &
          MOCK_AUTH_PID=$!
          echo "Mock auth server started, PID=$MOCK_AUTH_PID"
          sleep 2
          MOCK_AUTH_URL=$(cat mock-auth.url)
          echo "Mock auth URL=$MOCK_AUTH_URL"

          # Start production server
          PHIRA_API_ENDPOINT="$MOCK_AUTH_URL" node dist/server/main.js --port 12346 > server.log 2>&1 &
          SERVER_PID=$!
          echo "$SERVER_PID" > server.pid
          echo "Server started, PID=$SERVER_PID"
          sleep 3

          # Start server process metrics recorder
          ./node_modules/.bin/tsx bench/server-metrics-recorder.ts \
            --pid "$SERVER_PID" \
            --output bench-results/server-process-metrics.json \
            --stop-file bench-results/.stop-metrics &
          METRICS_PID=$!
          echo "$METRICS_PID" > metrics.pid
          echo "Metrics recorder started, PID=$METRICS_PID"

          # Run benchmarks
          BENCH_TOKEN="bench"

          echo ""
          echo ">>> Running connect-bench <<<"
          pnpm run bench:connect -- \
            --host 127.0.0.1 --port 12346 \
            --clients 300 --rate 50 --duration 60 \
            --token "$BENCH_TOKEN"

          echo ""
          echo ">>> Running room-bench <<<"
          pnpm run bench:room -- \
            --host 127.0.0.1 --port 12346 \
            --rooms 50 --players-per-room 4 --duration 60 \
            --token "$BENCH_TOKEN"

          echo ""
          echo ">>> Running gameplay-bench <<<"
          pnpm run bench:gameplay -- \
            --host 127.0.0.1 --port 12346 \
            --rooms 50 --players-per-room 4 --hz 20 --duration 60 \
            --token "$BENCH_TOKEN"

          # Stop metrics recorder (graceful with timeout, avoid wait hang)
          if [ -f metrics.pid ]; then
            METRICS_PID="$(cat metrics.pid)"
            echo "Stopping metrics recorder (PID=$METRICS_PID)..."
            # Signal stop via file (fallback if SIGTERM doesn't propagate)
            touch bench-results/.stop-metrics 2>/dev/null || true
            sleep 1
            kill "$METRICS_PID" 2>/dev/null || true
            for i in $(seq 1 10); do
              if ! kill -0 "$METRICS_PID" 2>/dev/null; then
                echo "Metrics recorder stopped."
                break
              fi
              sleep 0.5
            done
            kill -9 "$METRICS_PID" 2>/dev/null || true
            rm -f bench-results/.stop-metrics
          fi

          # Stop server (graceful with timeout)
          if [ -f server.pid ]; then
            SERVER_PID="$(cat server.pid)"
            echo "Stopping server (PID=$SERVER_PID)..."
            kill "$SERVER_PID" 2>/dev/null || true
            for i in $(seq 1 10); do
              if ! kill -0 "$SERVER_PID" 2>/dev/null; then
                echo "Server stopped."
                break
              fi
              sleep 0.5
            done
            kill -9 "$SERVER_PID" 2>/dev/null || true
          fi

          # Stop mock auth server (graceful with timeout)
          echo "Stopping mock auth server (PID=$MOCK_AUTH_PID)..."
          kill "$MOCK_AUTH_PID" 2>/dev/null || true
          for i in $(seq 1 10); do
            if ! kill -0 "$MOCK_AUTH_PID" 2>/dev/null; then
              echo "Mock auth server stopped."
              break
            fi
            sleep 0.5
          done
          kill -9 "$MOCK_AUTH_PID" 2>/dev/null || true

          # Copy server log into bench-results
          cp server.log bench-results/server.log

          # Generate performance report
          echo ""
          echo "Generating performance report..."
          ./node_modules/.bin/tsx bench/generate-performance-report.ts

          echo ""
          echo "Benchmark suite complete."
        continue-on-error: true

      - name: Upload benchmark results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: |
            bench-results/
            server.log
            performance-report.md

      - name: Package results for release
        if: always()
        run: |
          tar -czf benchmark-results.tar.gz bench-results/ server.log

      - name: Upload to release assets
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: benchmark-results.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
