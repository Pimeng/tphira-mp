name: Release Benchmark

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      network_scenarios:
        description: 'Comma-separated network scenarios to run (normal,weak,mobile,bad). Release always runs normal only.'
        required: false
        default: 'normal'
        type: string

jobs:
  benchmark:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SERVER_PORT: 12346
      BENCH_HOST: 127.0.0.1
      BENCH_DURATION: 60
      BENCH_TOKEN: bench
      BENCH_CONNECT_CLIENTS: 300
      BENCH_CONNECT_RATE: 50
      BENCH_ROOMS: 50
      BENCH_PLAYERS_PER_ROOM: 4
      BENCH_GAMEPLAY_HZ: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies and build
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Prepare server config
        run: |
          if [ ! -f server_config.yml ]; then
            cp server_config.example.yml server_config.yml
          fi
          mkdir -p bench-results

      - name: Start services and run benchmarks
        shell: bash
        run: |
          set -euo pipefail

          # ── Scenario configuration ──────────────────────────────────────
          if [ "${{ github.event_name }}" = "release" ]; then
            SCENARIOS="normal"
          else
            SCENARIOS="${{ inputs.network_scenarios }}"
            [ -z "$SCENARIOS" ] && SCENARIOS="normal"
          fi

          get_netem_args() {
            case "$1" in
              normal) echo "" ;;
              weak)   echo "delay 80ms 30ms loss 0.5%" ;;
              mobile) echo "delay 150ms 80ms loss 1%" ;;
              bad)    echo "delay 300ms 150ms loss 3%" ;;
              *)      echo "" ;;
            esac
          }

          setup_netem() {
            local scenario="$1"
            local args
            args=$(get_netem_args "$scenario")
            if [ -n "$args" ]; then
              echo ">>> Applying tc netem on lo: $args"
              # NOTE: Applying netem to the loopback interface affects ALL local traffic,
              # including communication between the mock auth server and the production server.
              # For full isolation in the future, consider network namespaces or Docker network emulation.
              sudo tc qdisc add dev lo root netem $args || true
            else
              echo ">>> No netem for scenario: $scenario"
            fi
          }

          cleanup_netem() {
            echo ">>> Cleaning up tc netem on lo..."
            sudo tc qdisc del dev lo root || true
          }

          # ── Service helpers ───────────────────────────────────────────────
          start_services() {
            local result_dir="$1"
            mkdir -p "$result_dir"

            echo ">>> Starting mock auth server..."
            ./node_modules/.bin/tsx bench/start-mock-auth.ts > mock-auth.url &
            MOCK_AUTH_PID=$!
            echo "Mock auth server started, PID=$MOCK_AUTH_PID"
            sleep 2
            MOCK_AUTH_URL=$(cat mock-auth.url)
            echo "Mock auth URL=$MOCK_AUTH_URL"
            export PHIRA_API_ENDPOINT="$MOCK_AUTH_URL"

            echo ""
            echo ">>> Starting production server..."
            node dist/server/main.js --port "$SERVER_PORT" > "$result_dir/server.log" 2>&1 &
            SERVER_PID=$!
            echo "Server started, PID=$SERVER_PID"
            sleep 3

            echo ""
            echo ">>> Starting metrics recorder..."
            ./node_modules/.bin/tsx bench/server-metrics-recorder.ts \
              --pid "$SERVER_PID" \
              --output "$result_dir/server-process-metrics.json" \
              --stop-file "$result_dir/.stop-metrics" &
            METRICS_PID=$!
            echo "Metrics recorder started, PID=$METRICS_PID"
          }

          stop_services() {
            local stop_file="${1:-bench-results/.stop-metrics}"
            echo ""
            echo ">>> Stopping background processes..."

            if [ -n "${METRICS_PID:-}" ] && kill -0 "$METRICS_PID" 2>/dev/null; then
              echo "Stopping metrics recorder (PID=$METRICS_PID)..."
              touch "$stop_file" 2>/dev/null || true
              sleep 1
              kill "$METRICS_PID" 2>/dev/null || true
              for i in $(seq 1 10); do
                if ! kill -0 "$METRICS_PID" 2>/dev/null; then
                  echo "Metrics recorder stopped."
                  break
                fi
                sleep 0.5
              done
              kill -9 "$METRICS_PID" 2>/dev/null || true
              rm -f "$stop_file"
            fi

            if [ -n "${SERVER_PID:-}" ] && kill -0 "$SERVER_PID" 2>/dev/null; then
              echo "Stopping server (PID=$SERVER_PID)..."
              kill "$SERVER_PID" 2>/dev/null || true
              for i in $(seq 1 10); do
                if ! kill -0 "$SERVER_PID" 2>/dev/null; then
                  echo "Server stopped."
                  break
                fi
                sleep 0.5
              done
              kill -9 "$SERVER_PID" 2>/dev/null || true
            fi

            if [ -n "${MOCK_AUTH_PID:-}" ] && kill -0 "$MOCK_AUTH_PID" 2>/dev/null; then
              echo "Stopping mock auth server (PID=$MOCK_AUTH_PID)..."
              kill "$MOCK_AUTH_PID" 2>/dev/null || true
              for i in $(seq 1 10); do
                if ! kill -0 "$MOCK_AUTH_PID" 2>/dev/null; then
                  echo "Mock auth server stopped."
                  break
                fi
                sleep 0.5
              done
              kill -9 "$MOCK_AUTH_PID" 2>/dev/null || true
            fi
          }

          copy_logs() {
            # server.log is already saved per-scenario under bench-results/<scenario>/server.log
            :
          }

          generate_report() {
            echo ""
            echo ">>> Generating performance report..."
            ./node_modules/.bin/tsx bench/generate-performance-report.ts || echo "Warning: performance report generation failed."
          }

          cleanup() {
            local exit_code=$?
            stop_services
            copy_logs
            generate_report
            cleanup_netem
            echo ""
            echo "Benchmark suite finished with exit code $exit_code."
            exit $exit_code
          }
          trap cleanup EXIT INT TERM

          # ── Benchmark helpers ─────────────────────────────────────────────
          run_benchmarks() {
            local result_dir="$1"
            local bench_exit=0
            export BENCH_RESULTS_DIR="$result_dir"

            echo ""
            echo ">>> Running connect-bench <<<"
            pnpm run bench:connect -- \
              --host "$BENCH_HOST" --port "$SERVER_PORT" \
              --clients "$BENCH_CONNECT_CLIENTS" --rate "$BENCH_CONNECT_RATE" --duration "$BENCH_DURATION" \
              --token "$BENCH_TOKEN" || bench_exit=$?

            echo ""
            echo ">>> Running room-bench <<<"
            pnpm run bench:room -- \
              --host "$BENCH_HOST" --port "$SERVER_PORT" \
              --rooms "$BENCH_ROOMS" --players-per-room "$BENCH_PLAYERS_PER_ROOM" --duration "$BENCH_DURATION" \
              --token "$BENCH_TOKEN" || bench_exit=$?

            echo ""
            echo ">>> Running gameplay-bench <<<"
            pnpm run bench:gameplay -- \
              --host "$BENCH_HOST" --port "$SERVER_PORT" \
              --rooms "$BENCH_ROOMS" --players-per-room "$BENCH_PLAYERS_PER_ROOM" --hz "$BENCH_GAMEPLAY_HZ" --duration "$BENCH_DURATION" \
              --token "$BENCH_TOKEN" || bench_exit=$?

            return $bench_exit
          }

          # ── Main ──────────────────────────────────────────────────────────
          main() {
            local overall_exit=0
            IFS=',' read -ra SCENARIO_ARRAY <<< "$SCENARIOS"
            for scenario in "${SCENARIO_ARRAY[@]}"; do
              scenario=$(echo "$scenario" | xargs)
              [ -z "$scenario" ] && continue

              echo ""
              echo "========================================"
              echo "  Scenario: $scenario"
              echo "========================================"

              local result_dir="bench-results/$scenario"

              setup_netem "$scenario"

              start_services "$result_dir"

              local scenario_exit=0
              run_benchmarks "$result_dir" || scenario_exit=$?

              if [ "$scenario_exit" -ne 0 ]; then
                echo "Warning: Scenario $scenario failed with exit code $scenario_exit"
                overall_exit=1
              fi

              stop_services "$result_dir/.stop-metrics"
              cleanup_netem

              echo "  Scenario $scenario finished."
            done

            echo ""
            echo "All scenarios completed."
            return $overall_exit
          }

          main

      - name: Package results
        if: always()
        run: |
          tar -czf benchmark-results.tar.gz bench-results/ performance-report.md || true

      - name: Upload benchmark results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: |
            bench-results/
            performance-report.md
            benchmark-results.tar.gz
          if-no-files-found: ignore

      - name: Write Job Summary
        if: always()
        run: |
          {
            echo "## 📊 基准测试摘要 / Benchmark Summary"
            echo ""
            if [ -f performance-report.md ]; then
              cat performance-report.md
            else
              echo "> ⚠️ 未找到 performance-report.md / performance-report.md not found."
            fi
            echo ""
            echo "---"
            echo "*触发方式 / Triggered by: ${{ github.event_name }}* · *运行编号 / Run: ${{ github.run_id }}*"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Generate AI Summary
        if: always()
        env:
          LLM_BASEURL: ${{ vars.LLM_BASEURL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          LLM_KEY: ${{ secrets.LLM_KEY }}
        run: |
          if [ -z "$LLM_BASEURL" ] || [ -z "$LLM_MODEL" ] || [ -z "$LLM_KEY" ]; then
            echo "⚠️ LLM configuration missing, skipping AI summary."
            exit 0
          fi

          if [ ! -f performance-report.md ]; then
            echo "⚠️ performance-report.md not found, skipping AI summary."
            exit 0
          fi

          API_ENDPOINT="${LLM_BASEURL%/}/chat/completions"
          REPORT_CONTENT=$(cat performance-report.md)

          PAYLOAD=$(jq -n \
            --arg model "$LLM_MODEL" \
            --arg content "$REPORT_CONTENT" \
            '{
              model: $model,
              messages: [
                {role: "system", content: "你是一名 DevOps 性能分析师。以下 benchmark 报告可能包含多个网络场景：normal（无限制）、weak（delay 80ms ±30ms，丢包 0.5%）、mobile（delay 150ms ±80ms，丢包 1%）、bad（delay 300ms ±150ms，丢包 3%）。请对比分析各场景结果，重点关注：1）关键指标（连接延迟、房间创建成功率、消息吞吐）在弱网条件下的退化幅度。2）异常、回归或离群点。3）若出现严重退化，给出可操作的改进建议。请用中文为主、英文为辅输出，使用 bullet points 或短段落，保持简洁。"},
                {role: "user", content: $content}
              ],
              temperature: 0.7,
              max_tokens: 1500
            }')

          RESPONSE=$(curl -s -w "\n%{http_code}" "$API_ENDPOINT" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $LLM_KEY" \
            -d "$PAYLOAD")

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "⚠️ LLM API request failed (HTTP $HTTP_CODE)."
            echo "Response body: $BODY"
            exit 0
          fi

          AI_SUMMARY=$(echo "$BODY" | jq -r '.choices[0].message.content // empty')

          if [ -n "$AI_SUMMARY" ]; then
            {
              echo ""
              echo "## 🤖 AI Summary / AI 智能总结"
              echo ""
              echo "$AI_SUMMARY"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "AI summary appended to job summary."
          else
            echo "⚠️ LLM returned empty content."
          fi

  release-asset:
    needs: benchmark
    if: github.event_name == 'release' && always() && needs.benchmark.result != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download benchmark artifact
        uses: actions/download-artifact@v4
        with:
          name: benchmark-results

      - name: Upload to release assets
        uses: softprops/action-gh-release@v2
        with:
          files: benchmark-results.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
