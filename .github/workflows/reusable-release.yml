name: Reusable Release Pipeline

on:
  workflow_call:
    inputs:
      version:
        description: 发布版本号，留空时读取 package.json。
        required: false
        type: string
        default: ''
      prerelease:
        description: 是否标记为预发布。
        required: false
        type: boolean
        default: false

# 顶层取最小只读基线；仅 release-and-docker 在 job 级提权到发布所需的写权限。
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 Node.js 和依赖
        uses: ./.github/actions/setup-node-pnpm

      - name: 运行测试
        run: pnpm test

  build:
    needs: [test]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 Node.js 和依赖
        uses: ./.github/actions/setup-node-pnpm

      # UPX 仅在 Windows 上安装：postject 注入后的 ELF/macOS 二进制 UPX 无法打包，
      # 详见 tools/package-sea.mjs 中的说明。
      - name: 安装 UPX (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install upx -y

      - name: 构建可执行文件
        run: pnpm run package:sea

      - name: 命名可执行文件（Win）
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $arch = "${{ runner.arch }}".ToLowerInvariant()
          Copy-Item release\phira-mp-server.exe "phira-mp-windows-${arch}.exe"

      # 裸二进制打成 tar.xz（实测比 gzip 小约 1/3：26.5MB vs 39.6MB）；解压后是统一命名的 phira-mp-server。
      - name: 打包可执行文件（Linux/macOS）
        if: runner.os != 'Windows'
        shell: bash
        run: |
          os="$(printf "%s" "${{ runner.os }}" | tr '[:upper:]' '[:lower:]')"
          arch="$(printf "%s" "${{ runner.arch }}" | tr '[:upper:]' '[:lower:]')"
          command -v xz >/dev/null 2>&1 || brew install xz
          tar -cf - -C release phira-mp-server | xz -9 -T0 > "phira-mp-${os}-${arch}.tar.xz"

      - name: 上传可执行文件
        uses: actions/upload-artifact@v4
        with:
          name: phira-mp-${{ runner.os }}-${{ runner.arch }}
          path: phira-mp-*

  build-freebsd:
    needs: [test]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 在 FreeBSD 上构建
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          prepare: |
            pkg install -y node22 npm-node22
            npm install -g pnpm@10.29.3
          run: |
            pnpm install --frozen-lockfile
            pnpm run package:sea
            # VM 内存有限，xz 单线程压缩（-9 多线程每线程峰值内存约 700MB）
            tar -cf - -C release phira-mp-server | xz -9 > phira-mp-freebsd-x64.tar.xz

      - name: 上传可执行文件
        uses: actions/upload-artifact@v4
        with:
          name: phira-mp-FreeBSD-X64
          path: phira-mp-freebsd-x64.tar.xz

  build-bundle:
    needs: [test]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 Node.js 和依赖
        uses: ./.github/actions/setup-node-pnpm

      - name: 构建 Bundle
        run: pnpm run bundle:server

      - name: 制作压缩包
        shell: bash
        run: |
          mkdir -p phira-mp-nodejs/locales
          cp dist-bundle/server.cjs phira-mp-nodejs/server.js
          node tools/emit-locales-json.mjs phira-mp-nodejs/locales/locales.json
          cp server_config.example.yml phira-mp-nodejs/server_config.yml
          zip -r phira-mp-nodejs.zip phira-mp-nodejs

      - name: 上传压缩包
        uses: actions/upload-artifact@v4
        with:
          name: phira-mp-nodejs-bundle
          path: phira-mp-nodejs.zip

  release-and-docker:
    needs: [build, build-freebsd, build-bundle]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # 发 GitHub Release 需 contents:write；推送 GHCR 镜像需 packages:write。
    permissions:
      contents: write
      packages: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      release_notes: ${{ steps.notes.outputs.release_notes }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 下载压缩包
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 生成自定义 Release Notes
        id: notes
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PREVIOUS_VERSION=$(gh release list --limit 100 --json tagName,isPrerelease \
            --jq '[.[] | select(.isPrerelease == false) | .tagName] | .[0]' 2>/dev/null || echo "")

          if [ -z "$PREVIOUS_VERSION" ]; then
            echo "未找到上一个 release，读取所有提交"
            COMMITS=$(git log --pretty=format:"%s")
          else
            echo "找到上一个 release 版本: ${PREVIOUS_VERSION}"
            git fetch --tags origin

            if git rev-parse "refs/tags/${PREVIOUS_VERSION}" >/dev/null 2>&1; then
              echo "从远程 tag ${PREVIOUS_VERSION} 到 HEAD 对比提交"
              COMMITS=$(git log ${PREVIOUS_VERSION}..HEAD --pretty=format:"%s")
            else
              echo "警告: 远程 tag ${PREVIOUS_VERSION} 不存在，读取所有提交"
              COMMITS=$(git log --pretty=format:"%s")
            fi
          fi

          echo "提交列表：$COMMITS"

          # 有的提交把多个 conventional 段塞进同一行（如 "feat: A refactor: B refactor: C"）。
          # 在每个内嵌的 "<type>:" 前断行，让每段各自归类，避免整段被并入第一个类型（如全进“新增”）。
          COMMITS=$(printf '%s\n' "$COMMITS" \
            | sed -E 's/[[:space:]]+(feat|fix|perf|refactor|improvement|chore|i18n|docs|test|ci|build|style|revert)(\([^)]*\))?:[[:space:]]/\n\1\2: /gI')

          echo "拆分归类后：$COMMITS"

          FEATURES=""
          FIXES=""
          IMPROVEMENTS=""
          OTHERS=""

          # 类型前缀大小写不敏感（兼容 "Refactor:"、"Fix:" 等）
          shopt -s nocasematch

          while IFS= read -r line; do
            [[ -z "$line" ]] && continue

            if [[ $line =~ ^feat(\(.*\))?:\ (.*) ]]; then
              FEATURES+="* ${BASH_REMATCH[2]}"$'\n'
            elif [[ $line =~ ^fix(\(.*\))?:\ (.*) ]]; then
              FIXES+="* ${BASH_REMATCH[2]}"$'\n'
            elif [[ $line =~ ^(perf|refactor|improvement|chore|i18n)(\(.*\))?:\ (.*) ]]; then
              IMPROVEMENTS+="* ${BASH_REMATCH[3]}"$'\n'
            elif [[ ! $line =~ ^(docs|test|ci)(\(.*\))?:\ (.*) ]]; then
              OTHERS+="* $line"$'\n'
            fi
          done <<< "$COMMITS"

          shopt -u nocasematch

          NOTES="## 更新"$'\n'

          if [ -n "$FEATURES" ]; then
            NOTES+="### ✨ 新增"$'\n'
            NOTES+="$FEATURES"
          fi

          if [ -n "$FIXES" ]; then
            NOTES+="### 🐛 修复"$'\n'
            NOTES+="$FIXES"
          fi

          if [ -n "$IMPROVEMENTS" ]; then
            NOTES+="### 🔄 改进"$'\n'
            NOTES+="$IMPROVEMENTS"
          fi

          if [ -n "$OTHERS" ]; then
            NOTES+="### 📝 其他"$'\n'
            NOTES+="$OTHERS"
          fi

          # 获取当前版本（用于生成对比链接）
          input_version="${{ inputs.version }}"
          if [ -n "$input_version" ]; then
            current_version="$input_version"
          else
            current_version=$(node -p "require('./package.json').version")
          fi
          CURRENT_TAG="v${current_version}"

          NOTES+="***"$'\n'
          if [ -n "$PREVIOUS_VERSION" ]; then
            NOTES+="[完整更新日志](https://github.com/${{ github.repository }}/compare/${PREVIOUS_VERSION}...${CURRENT_TAG})"
          else
            NOTES+="完整更新日志"
          fi

          echo "release_notes<<EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: 获取当前版本
        id: version
        shell: bash
        run: |
          input_version="${{ inputs.version }}"
          if [ -n "$input_version" ]; then
            version="$input_version"
          else
            version=$(node -p "require('./package.json').version")
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: 列出 artifacts 目录结构
        shell: bash
        run: find artifacts -type f -name "*.zip" | head -20

      - name: 由 ftl 生成 release 资产 locales.json
        shell: bash
        run: node tools/emit-locales-json.mjs locales.json

      - name: 发布到 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          files: |
            artifacts/phira-mp-Linux-ARM64/phira-mp-linux-arm64.tar.xz
            artifacts/phira-mp-Linux-X64/phira-mp-linux-x64.tar.xz
            artifacts/phira-mp-Windows-X64/phira-mp-windows-x64.exe
            artifacts/phira-mp-macOS-ARM64/phira-mp-macos-arm64.tar.xz
            artifacts/phira-mp-FreeBSD-X64/phira-mp-freebsd-x64.tar.xz
            artifacts/phira-mp-nodejs-bundle/*.zip
            locales.json
            server_config.example.yml
          body: ${{ steps.notes.outputs.release_notes }}
          prerelease: ${{ inputs.prerelease }}
          make_latest: ${{ !inputs.prerelease }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 设置 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成镜像标签
        id: meta
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          repo_lc="${REPOSITORY,,}"
          image="ghcr.io/${repo_lc}"

          version="${{ steps.version.outputs.version }}"
          version_lc="${version,,}"
          version_tag="v${version_lc}"

          tags=()
          tags+=("${image}:${version_tag}")

          # 仅正式版打滚动标签：latest 指向最新正式版，vX.Y 指向该系列最新补丁（不限 patch）
          if [ "${{ inputs.prerelease }}" != "true" ]; then
            tags+=("${image}:latest")
            if [[ "$version_lc" =~ ^([0-9]+)\.([0-9]+)\.[0-9]+$ ]]; then
              tags+=("${image}:v${BASH_REMATCH[1]}.${BASH_REMATCH[2]}")
            fi
          fi

          printf "tags=%s\n" "$(IFS=, ; echo "${tags[*]}")" >> "$GITHUB_OUTPUT"
          printf "version=%s\n" "$version_tag" >> "$GITHUB_OUTPUT"

      - name: 构建并推送 Docker 镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          target: runtime-sea
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            PHIRA_MP_VERSION=${{ steps.meta.outputs.version }}
          pull: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

  sync-cnb-release:
    needs: [release-and-docker]
    # 未配置同步 token 时直接跳过整个 job，省得白下载一遍构建产物。
    if: ${{ secrets.CNB_TOKEN_FOR_SYNC_TPHIRA_MIRROR != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      CNB_TOKEN: ${{ secrets.CNB_TOKEN_FOR_SYNC_TPHIRA_MIRROR }}
      TAG_NAME: v${{ needs.release-and-docker.outputs.version }}
      RELEASE_BODY: ${{ needs.release-and-docker.outputs.release_notes }}
      PRERELEASE: ${{ inputs.prerelease }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 由 ftl 生成 locales.json
        run: node tools/emit-locales-json.mjs locales.json

      - name: 创建 CNB release 并上传附件
        shell: bash
        run: |
          set -euo pipefail

          REPO="Phira-download/tphira-mp-mirror"
          API_ENDPOINT="https://api.cnb.cool/${REPO}/-/releases"

          if [ "$PRERELEASE" = "true" ]; then
            MAKE_LATEST="false"
          else
            MAKE_LATEST="true"
          fi

          # CNB 镜像仓库默认分支叫 master（GitHub 这边是 main），target_commitish 必填，
          # 实测得出：传分支名而非具体 commit，由 CNB 自行解析为创建时的分支 HEAD。
          PAYLOAD=$(jq -n \
            --arg tag_name "$TAG_NAME" \
            --arg name "$TAG_NAME" \
            --arg body "$RELEASE_BODY" \
            --argjson prerelease "$PRERELEASE" \
            --arg make_latest "$MAKE_LATEST" \
            --arg target_commitish "master" \
            '{tag_name: $tag_name, name: $name, body: $body, prerelease: $prerelease, make_latest: $make_latest, target_commitish: $target_commitish}')

          RESPONSE=$(curl -s -w "\n%{http_code}" "$API_ENDPOINT" \
            -X POST \
            -H "Content-Type: application/json" \
            -H "Accept: application/vnd.cnb.api+json" \
            -H "Authorization: Bearer $CNB_TOKEN" \
            -d "$PAYLOAD")

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          if [ "$HTTP_CODE" != "201" ]; then
            echo "⚠️ CNB release 创建失败 (HTTP $HTTP_CODE)。"
            echo "响应内容: $BODY"
            exit 1
          fi

          RELEASE_ID=$(echo "$BODY" | jq -r '.id')
          echo "CNB release 创建成功：$TAG_NAME (id=$RELEASE_ID)"

          # 与 reusable-release.yml 里发 GitHub Release 的 files 列表保持一致。
          shopt -s nullglob
          ASSET_FILES=(
            artifacts/phira-mp-Linux-ARM64/phira-mp-linux-arm64.tar.xz
            artifacts/phira-mp-Linux-X64/phira-mp-linux-x64.tar.xz
            artifacts/phira-mp-Windows-X64/phira-mp-windows-x64.exe
            artifacts/phira-mp-macOS-ARM64/phira-mp-macos-arm64.tar.xz
            artifacts/phira-mp-FreeBSD-X64/phira-mp-freebsd-x64.tar.xz
            artifacts/phira-mp-nodejs-bundle/*.zip
            locales.json
            server_config.example.yml
          )

          for FILE in "${ASSET_FILES[@]}"; do
            if [ ! -f "$FILE" ]; then
              echo "⚠️ 跳过不存在的文件：$FILE"
              continue
            fi

            ASSET_NAME=$(basename "$FILE")
            SIZE=$(stat -c%s "$FILE")

            UPLOAD_URL_PAYLOAD=$(jq -n \
              --arg asset_name "$ASSET_NAME" \
              --argjson size "$SIZE" \
              '{asset_name: $asset_name, size: $size, overwrite: true, ttl: 0}')

            UPLOAD_URL_RESPONSE=$(curl -s -w "\n%{http_code}" "${API_ENDPOINT}/${RELEASE_ID}/asset-upload-url" \
              -X POST \
              -H "Content-Type: application/json" \
              -H "Accept: application/vnd.cnb.api+json" \
              -H "Authorization: Bearer $CNB_TOKEN" \
              -d "$UPLOAD_URL_PAYLOAD")

            UPLOAD_URL_HTTP_CODE=$(echo "$UPLOAD_URL_RESPONSE" | tail -n1)
            UPLOAD_URL_BODY=$(echo "$UPLOAD_URL_RESPONSE" | sed '$d')

            if [ "$UPLOAD_URL_HTTP_CODE" != "201" ]; then
              echo "⚠️ 获取 ${ASSET_NAME} 上传地址失败 (HTTP $UPLOAD_URL_HTTP_CODE)：$UPLOAD_URL_BODY"
              exit 1
            fi

            UPLOAD_URL=$(echo "$UPLOAD_URL_BODY" | jq -r '.upload_url')
            VERIFY_URL=$(echo "$UPLOAD_URL_BODY" | jq -r '.verify_url')

            PUT_HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X PUT --data-binary "@${FILE}" "$UPLOAD_URL")
            if [ "$PUT_HTTP_CODE" -ge 300 ]; then
              echo "⚠️ 上传 ${ASSET_NAME} 内容失败 (HTTP $PUT_HTTP_CODE)"
              exit 1
            fi

            CONFIRM_RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "$VERIFY_URL" \
              -H "Accept: application/vnd.cnb.api+json" \
              -H "Authorization: Bearer $CNB_TOKEN")

            CONFIRM_HTTP_CODE=$(echo "$CONFIRM_RESPONSE" | tail -n1)
            CONFIRM_BODY=$(echo "$CONFIRM_RESPONSE" | sed '$d')

            if [ "$CONFIRM_HTTP_CODE" != "200" ]; then
              echo "⚠️ 确认 ${ASSET_NAME} 上传失败 (HTTP $CONFIRM_HTTP_CODE)：$CONFIRM_BODY"
              exit 1
            fi

            echo "已上传附件：$ASSET_NAME"
          done