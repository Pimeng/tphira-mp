name: Reusable Release Pipeline

on:
  workflow_call:
    inputs:
      version:
        description: 发布版本号，留空时读取 package.json。
        required: false
        type: string
        default: ''
      prerelease:
        description: 是否标记为预发布。
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 Node.js 和依赖
        uses: ./.github/actions/setup-node-pnpm

      - name: 运行测试
        run: pnpm test

  build:
    needs: [test]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 Node.js 和依赖
        uses: ./.github/actions/setup-node-pnpm

      - name: 构建可执行文件
        run: pnpm run package:sea

      - name: 制作压缩包（Win）
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $os = "${{ runner.os }}".ToLowerInvariant()
          $arch = "${{ runner.arch }}".ToLowerInvariant()
          $name = "phira-mp-$os-$arch.zip"
          if (Test-Path $name) { Remove-Item $name -Force }
          Compress-Archive -Path release\* -DestinationPath $name

      - name: 制作压缩包（Linux/macOS）
        if: runner.os != 'Windows'
        shell: bash
        run: |
          os="$(printf "%s" "${{ runner.os }}" | tr '[:upper:]' '[:lower:]')"
          arch="$(printf "%s" "${{ runner.arch }}" | tr '[:upper:]' '[:lower:]')"
          name="phira-mp-${os}-${arch}.zip"
          rm -f "$name"
          (cd release && zip -r "../$name" .)

      - name: 上传压缩包
        uses: actions/upload-artifact@v4
        with:
          name: phira-mp-${{ runner.os }}-${{ runner.arch }}
          path: |
            phira-mp-*.zip

  build-freebsd:
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 在 FreeBSD 上构建
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          prepare: |
            pkg install -y node22 npm-node22 zip
            npm install -g pnpm@10.29.3
          run: |
            pnpm install --frozen-lockfile
            pnpm run package:sea
            cd release && zip -r ../phira-mp-freebsd-x64.zip .

      - name: 上传压缩包
        uses: actions/upload-artifact@v4
        with:
          name: phira-mp-FreeBSD-X64
          path: phira-mp-freebsd-x64.zip

  build-bundle:
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 Node.js 和依赖
        uses: ./.github/actions/setup-node-pnpm

      - name: 构建 Bundle
        run: pnpm run bundle:server

      - name: 制作压缩包
        shell: bash
        run: |
          mkdir -p phira-mp-nodejs
          cp dist-bundle/server.cjs phira-mp-nodejs/server.js
          cp -r locales phira-mp-nodejs/locales
          cp server_config.example.yml phira-mp-nodejs/server_config.yml
          zip -r phira-mp-nodejs.zip phira-mp-nodejs

      - name: 上传压缩包
        uses: actions/upload-artifact@v4
        with:
          name: phira-mp-nodejs-bundle
          path: phira-mp-nodejs.zip

  release-and-docker:
    needs: [build, build-freebsd, build-bundle]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 下载压缩包
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 生成自定义 Release Notes
        id: notes
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PREVIOUS_VERSION=$(gh release list --limit 100 --json tagName,isPrerelease \
            --jq '[.[] | select(.isPrerelease == false) | .tagName] | .[0]' 2>/dev/null || echo "")

          if [ -z "$PREVIOUS_VERSION" ]; then
            echo "未找到上一个 release，读取所有提交"
            COMMITS=$(git log --pretty=format:"%s")
          else
            echo "找到上一个 release 版本: ${PREVIOUS_VERSION}"
            git fetch --tags origin

            if git rev-parse "refs/tags/${PREVIOUS_VERSION}" >/dev/null 2>&1; then
              echo "从远程 tag ${PREVIOUS_VERSION} 到 HEAD 对比提交"
              COMMITS=$(git log ${PREVIOUS_VERSION}..HEAD --pretty=format:"%s")
            else
              echo "警告: 远程 tag ${PREVIOUS_VERSION} 不存在，读取所有提交"
              COMMITS=$(git log --pretty=format:"%s")
            fi
          fi

          echo "提交列表：$COMMITS"

          FEATURES=""
          FIXES=""
          IMPROVEMENTS=""
          OTHERS=""

          while IFS= read -r line; do
            [[ -z "$line" ]] && continue

            if [[ $line =~ ^feat(\(.*\))?:\ (.*) ]]; then
              FEATURES+="* ${BASH_REMATCH[2]}"$'\n'
            elif [[ $line =~ ^fix(\(.*\))?:\ (.*) ]]; then
              FIXES+="* ${BASH_REMATCH[2]}"$'\n'
            elif [[ $line =~ ^(perf|refactor|improvement|chore)(\(.*\))?:\ (.*) ]]; then
              IMPROVEMENTS+="* ${BASH_REMATCH[3]}"$'\n'
            elif [[ ! $line =~ ^(docs|test|ci)(\(.*\))?:\ (.*) ]]; then
              OTHERS+="* $line"$'\n'
            fi
          done <<< "$COMMITS"

          NOTES="## 更新"$'\n'

          if [ -n "$FEATURES" ]; then
            NOTES+="### ✨ 新增"$'\n'
            NOTES+="$FEATURES"
          fi

          if [ -n "$FIXES" ]; then
            NOTES+="### 🐛 修复"$'\n'
            NOTES+="$FIXES"
          fi

          if [ -n "$IMPROVEMENTS" ]; then
            NOTES+="### 🔄 改进"$'\n'
            NOTES+="$IMPROVEMENTS"
          fi

          if [ -n "$OTHERS" ]; then
            NOTES+="### 📝 其他"$'\n'
            NOTES+="$OTHERS"
          fi

          NOTES+="***"$'\n'
          NOTES+="完整更新日志"

          echo "release_notes<<EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: 获取当前版本
        id: version
        shell: bash
        run: |
          input_version="${{ inputs.version }}"
          if [ -n "$input_version" ]; then
            version="$input_version"
          else
            version=$(node -p "require('./package.json').version")
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: 列出 artifacts 目录结构
        shell: bash
        run: find artifacts -type f -name "*.zip" | head -20

      - name: 发布到 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          files: |
            artifacts/phira-mp-Linux-ARM64/*.zip
            artifacts/phira-mp-Linux-X64/*.zip
            artifacts/phira-mp-Windows-X64/*.zip
            artifacts/phira-mp-macOS-ARM64/*.zip
            artifacts/phira-mp-FreeBSD-X64/*.zip
            artifacts/phira-mp-nodejs-bundle/*.zip
          body: ${{ steps.notes.outputs.release_notes }}
          prerelease: ${{ inputs.prerelease }}
          make_latest: ${{ !inputs.prerelease }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 设置 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成镜像标签
        id: meta
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          repo_lc="${REPOSITORY,,}"
          image="ghcr.io/${repo_lc}"

          version="${{ steps.version.outputs.version }}"
          version_lc="${version,,}"
          version_tag="v${version_lc}"

          tags=()
          tags+=("${image}:${version_tag}")
          if [[ "$version_lc" =~ ^([0-9]+)\.([0-9]+)\.0$ ]]; then
            tags+=("${image}:v${BASH_REMATCH[1]}.${BASH_REMATCH[2]}")
          fi

          if [ "${{ inputs.prerelease }}" != "true" ]; then
            tags+=("${image}:latest")
          fi

          printf "tags=%s\n" "$(IFS=, ; echo "${tags[*]}")" >> "$GITHUB_OUTPUT"
          printf "version=%s\n" "$version_tag" >> "$GITHUB_OUTPUT"

      - name: 构建并推送 Docker 镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          target: runtime-sea
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            PHIRA_MP_VERSION=${{ steps.meta.outputs.version }}
          pull: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 清理构建缓存
        if: always()
        shell: bash
        run: |
          docker builder prune -af || true
          docker system prune -af || true